apiVersion: idp.y.digital/v1alpha1
kind: DexTenant
metadata:
  labels:
    app.kubernetes.io/name: dex-idp-operator
    app.kubernetes.io/managed-by: kustomize
  name: dextenant-sample
spec:
  # issuer must be externally reachable; the operator only creates a Service, so an
  # Ingress/Gateway route pointing at that Service must be configured separately.
  issuer: https://dextenant-sample.example.com/dex
  connectorRef:
    name: dexconnector-sample
  replicas: 1
  oauth2:
    # Skip Dex's consent page only when every registered client is trusted.
    skipApprovalScreen: false
    # Pass through to Dex oauth2.grantTypes. Include client_credentials for M2M.
    grantTypes:
      - authorization_code
      - refresh_token
      - client_credentials
      - urn:ietf:params:oauth:grant-type:token-exchange
