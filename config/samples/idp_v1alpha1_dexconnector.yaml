apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/name: dex-idp-operator
    app.kubernetes.io/managed-by: kustomize
  name: dexconnector-sample-oidc-secret
stringData:
  clientSecret: change-me
---
apiVersion: idp.y.digital/v1alpha1
kind: DexConnector
metadata:
  labels:
    app.kubernetes.io/name: dex-idp-operator
    app.kubernetes.io/managed-by: kustomize
  name: dexconnector-sample
spec:
  connectorID: upstream-oidc
  type: oidc
  displayName: Upstream OIDC
  # String values may embed "${name}" placeholders that reference secretRefs entries; the
  # controller substitutes the resolved Secret value before applying this config to Dex.
  config:
    issuer: https://upstream-idp.example.com
    clientID: dex
    clientSecret: ${oidcClientSecret}
    redirectURI: https://dex.example.com/callback
  secretRefs:
    - name: oidcClientSecret
      valueFrom:
        secretKeyRef:
          name: dexconnector-sample-oidc-secret
          key: clientSecret
