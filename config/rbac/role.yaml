- apiGroups:
  - idp.groeneslot.nl
  resources:
  - dexclients/status
  - dexconnections/status
  - dexconnectors/status
  - dextenants/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
