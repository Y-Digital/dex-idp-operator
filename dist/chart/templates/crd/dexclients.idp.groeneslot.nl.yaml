{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.20.1
  name: dexclients.idp.groeneslot.nl
spec:
  group: idp.groeneslot.nl
  names:
    kind: DexClient
    listKind: DexClientList
    plural: dexclients
    singular: dexclient
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DexClient is the Schema for the dexclients API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of DexClient
            properties:
              clientID:
                description: clientID is the Dex OAuth2 client identifier.
                minLength: 1
                type: string
              connectionRef:
                description: |-
                  connectionRef references the DexConnection used to reach Dex. Mutually exclusive with
                  tenantRefs.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              logoURL:
                description: logoURL is the URL to a client logo shown by Dex.
                type: string
              name:
                description: name is the human-readable client name shown by Dex.
                type: string
              public:
                description: public marks the client as public and disables client
                  secret usage.
                type: boolean
              recreateOnImmutableChange:
                description: |-
                  recreateOnImmutableChange allows the controller to delete and recreate the
                  Dex client when immutable Dex fields such as secret or public change.
                type: boolean
              redirectURIs:
                description: redirectURIs are OAuth2 redirect URIs accepted by Dex.
                items:
                  type: string
                type: array
              secret:
                description: |-
                  secret contains the client secret for confidential clients. Only valid together with
                  connectionRef; when tenantRefs is set, the operator generates a distinct secret per
                  tenant instead.
                properties:
                  value:
                    description: value is the inline value.
                    type: string
                  valueFrom:
                    description: valueFrom references a Kubernetes Secret key containing
                      the value.
                    properties:
                      secretKeyRef:
                        description: secretKeyRef selects the Secret key containing
                          the value.
                        properties:
                          key:
                            description: The key of the secret to select from.  Must
                              be a valid secret key.
                            type: string
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                          optional:
                            description: Specify whether the Secret or its key must
                              be defined
                            type: boolean
                        required:
                        - key
                        type: object
                        x-kubernetes-map-type: atomic
                    required:
                    - secretKeyRef
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one of value or valueFrom must be set
                  rule: has(self.value) != has(self.valueFrom)
              tenantRefs:
                description: |-
                  tenantRefs mount this client onto multiple tenant-scoped Dex contexts. Each referenced
                  DexTenant runs its own Dex instance with its own upstream IDP connector, so the same
                  OAuth2 client can authenticate against different IDPs depending on which tenant issuer
                  a request targets. Mutually exclusive with connectionRef. Confidential clients
                  (public=false) mounted this way receive a distinct, operator-generated client secret
                  per tenant.
                items:
                  description: |-
                    DexTenantReference identifies a DexTenant that a DexClient mounts onto. Dex's Kubernetes
                    storage backend scopes all state, including which connectors are offered for login, to the
                    Kubernetes namespace a Dex instance runs in. Isolating one tenant's upstream IDP from
                    another's therefore requires running each DexTenant in its own namespace, so unlike most
                    same-object references in this API, tenantRefs must be able to cross namespaces.
                  properties:
                    name:
                      description: name is the name of the referenced DexTenant.
                      minLength: 1
                      type: string
                    namespace:
                      description: |-
                        namespace is the namespace of the referenced DexTenant. Defaults to the DexClient's own
                        namespace when unset.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              trustedPeers:
                description: trustedPeers are Dex client IDs trusted by this client.
                items:
                  type: string
                type: array
            required:
            - clientID
            type: object
            x-kubernetes-validations:
            - message: secret is required when public is false, unless tenantRefs
                is set
              rule: (has(self.public) && self.public) || has(self.secret) || (has(self.tenantRefs)
                && size(self.tenantRefs) > 0)
            - message: secret must not be set when public is true
              rule: '!(has(self.public) && self.public) || !has(self.secret)'
            - message: exactly one of connectionRef or tenantRefs must be set
              rule: has(self.connectionRef) != (has(self.tenantRefs) && size(self.tenantRefs)
                > 0)
            - message: secret must not be set when tenantRefs is set; the operator
                generates a distinct secret per tenant
              rule: '!(has(self.tenantRefs) && size(self.tenantRefs) > 0) || !has(self.secret)'
          status:
            description: status defines the observed state of DexClient
            properties:
              clientID:
                description: clientID is the Dex client identifier last observed by
                  the controller.
                type: string
              conditions:
                description: conditions represent the current state of the DexClient
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              mounts:
                description: mounts reports the sync status of this client against
                  each mount target.
                items:
                  description: |-
                    DexClientMountStatus reports the sync status of a DexClient against one mount target,
                    either the single connectionRef target or one entry from tenantRefs.
                  properties:
                    message:
                      description: message is a human-readable message describing
                        the current status.
                      type: string
                    ready:
                      description: ready reports whether this target is synced with
                        Dex.
                      type: boolean
                    reason:
                      description: reason is a short machine-readable reason for the
                        current status.
                      type: string
                    secretRef:
                      description: |-
                        secretRef is the name of the Secret holding the client secret used for this target,
                        when applicable.
                      type: string
                    target:
                      description: |-
                        target identifies the mount target, formatted as "connection:<name>" or
                        "tenant:<namespace>/<name>".
                      type: string
                  required:
                  - target
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - target
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the last generation observed by
                  the controller.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
